name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Frontend build and tests
        run: |
          npm ci
          npm run check
      - name: Rust formatting, lint and tests
        run: |
          cargo +stable fmt --manifest-path src-tauri/Cargo.toml --check
          cargo +stable clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo +stable test --manifest-path src-tauri/Cargo.toml --locked
      - name: Real SSH and SFTP integration
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          npm run test:integration
      - name: Validate macOS application bundle
        run: npm run tauri build -- --debug --bundles app
